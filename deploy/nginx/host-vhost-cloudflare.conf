# dht44.com vhost — host-nginx variant, behind Cloudflare.
#
# This is the alternative deploy topology to deploy/nginx/nginx.conf
# (which assumes nginx-in-docker, Let's Encrypt, Umami subdomain, and a
# Tailscale-attached residential daemon box).
#
# This variant assumes:
#   * Host nginx terminates TLS on the same VPS that runs the C daemon,
#     and reverse-proxies /api/ + /stream to 127.0.0.1:8877.
#   * TLS uses a Cloudflare Origin Certificate (15-yr validity, signed
#     only by CF — requires CF SSL mode = Full or Full (Strict)).
#   * Cloudflare Web Analytics replaces Umami; no analytics subdomain.
#   * SPA bundle in /var/www/dht44.com (rsynced from frontend/dist).
#   * The static og:image at /og.png is regenerated daily by the
#     dht44-og.timer systemd unit (deploy/systemd/dht44-og.{service,timer}).
#
# Install path: /etc/nginx/sites-available/dht44.com (symlinked from
# /etc/nginx/sites-enabled/). Security headers live in a snippet at
# /etc/nginx/snippets/dht44-security-headers.conf — see the matching
# file under deploy/nginx/snippets/ in this repo.
#
# Gotchas captured here from past incidents:
#   * `localhost` resolves to ::1 first; the C daemon binds v4 only —
#     proxy_pass MUST use 127.0.0.1.
#   * try_files inside /dashboard must fall back to /index.html, not
#     /dashboard/index.html (which doesn't exist and would loop into a
#     500 "rewrite or internal redirection cycle").
#   * `ssi on` is required at every leaf location whose try_files might
#     internally redirect to /index.html — without it the SSI filter is
#     bypassed and `<!--# include ... -->` is served literally.
#   * `expires 1y; add_header Cache-Control "..."` emits TWO
#     cache-control headers (one from the expires module, one from
#     add_header). Use add_header alone where the value is non-trivial
#     (e.g. /og.png with max-age=3600 and the daily-regenerated file
#     above), expires alone for the simple immutable case.

server {
    listen 80;
    listen [::]:80;
    server_name dht44.com www.dht44.com;
    # Cloudflare handles HTTP→HTTPS at the edge; this is for any direct-IP hits.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dht44.com www.dht44.com;

    ssl_certificate     /etc/ssl/cloudflare/dht44.com/origin.crt;
    ssl_certificate_key /etc/ssl/cloudflare/dht44.com/origin.key;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/dht44.com;
    index index.html;

    include snippets/dht44-security-headers.conf;

    # og:image is regenerated daily. Exact-match takes precedence over
    # the regex `\.png$` block below, which would mark it immutable for
    # a year. 1h max-age is short enough that CF + browsers re-fetch
    # within a day, long enough that share-card scrapers stay cached.
    location = /og.png {
        add_header Cache-Control "public, max-age=3600";
        include snippets/dht44-security-headers.conf;
    }

    # Long-cache hashed assets (vite emits content-hashed filenames).
    location ~* \.(?:js|css|woff2|png|jpg|svg|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include snippets/dht44-security-headers.conf;
    }
    location = /index.html {
        ssi on;
        ssi_silent_errors on;
        add_header Cache-Control "no-cache";
        include snippets/dht44-security-headers.conf;
    }
    location = /robots.txt {
        add_header Cache-Control "public, max-age=3600";
        include snippets/dht44-security-headers.conf;
    }
    location = /llms.txt {
        add_header Cache-Control "public, max-age=3600";
        include snippets/dht44-security-headers.conf;
    }
    location = /sitemap.xml {
        add_header Cache-Control "public, max-age=3600";
        include snippets/dht44-security-headers.conf;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8877;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    location /stream {
        proxy_pass http://127.0.0.1:8877/stream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1d;
    }

    location = /favicon.ico {
        log_not_found off;
        access_log off;
        return 204;
    }

    location /dashboard {
        ssi on;
        ssi_silent_errors on;
        try_files $uri $uri/ /index.html;
    }
    location / {
        ssi on;
        ssi_silent_errors on;
        try_files $uri $uri/ $uri.html /index.html;
    }
}
