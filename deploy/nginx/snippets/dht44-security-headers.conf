# Snippet: security headers for dht44.com.
#
# Why a snippet: nginx's `add_header` is non-cumulative — if any
# add_header exists at the current level, server-level add_headers
# are NOT inherited. So every leaf location with its own add_header
# (cache-control on /index.html, /robots.txt, /llms.txt, /sitemap.xml,
# the long-cache asset regex) must `include` this file to keep the
# security headers attached.
#
# CSP value MUST be a single nginx string — `\` at end of line is a
# literal backslash inside a quoted value, not a continuation.
# script-src: 'self' for our bundled JS, plus
#   static.cloudflareinsights.com for the CF "Browser Insights"
#   beacon (auto-injected when the CF proxy is on).
# connect-src: 'self' for /api/*; wss://dht44.com for the live
#   WebSocket; cloudflareinsights.com for the CF beacon's POST.
# Umami was removed (Cloudflare's analytics is enough) — both
#   cloud.umami.is and api-gateway.umami.dev are out of the CSP.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' wss://dht44.com https://cloudflareinsights.com; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff"                                   always;
add_header X-Frame-Options        "DENY"                                      always;
add_header Referrer-Policy        "strict-origin-when-cross-origin"           always;
add_header Permissions-Policy     "geolocation=(), microphone=(), camera=()"  always;
