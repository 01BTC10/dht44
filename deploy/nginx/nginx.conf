# dht44.com production vhost.
#
# Three server blocks:
#   1. dht44.com / www.dht44.com  — main site (static + /api proxy + /stream WS)
#   2. analytics.dht44.com         — Umami container (proxy_pass)
#   3. :80                          — HTTP→HTTPS redirect + ACME webroot
#
# Pre-conditions:
#   * /etc/letsencrypt has live certs for dht44.com, www.dht44.com,
#     analytics.dht44.com (issued via the certbot service in compose).
#   * The home box's dht44 daemon is reachable at
#     ds1621.tail7aed4e.ts.net:8877 over Tailscale from this VPS.
#   * /var/www/certbot is mounted from the certbot-webroot volume.

# ----- main site -----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dht44.com www.dht44.com;

    ssl_certificate     /etc/letsencrypt/live/dht44.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dht44.com/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    # Long-cache hashed assets, no-cache the HTML shell.
    location ~* \.(?:js|css|woff2|png|jpg|svg|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html        { add_header Cache-Control "no-cache"; }
    location = /robots.txt        { add_header Cache-Control "public, max-age=3600"; }
    location = /llms.txt          { add_header Cache-Control "public, max-age=3600"; }
    location = /sitemap.xml       { add_header Cache-Control "public, max-age=3600"; }

    # API + WebSocket → home box over Tailscale.
    # The C daemon stays on residential IP for crawl quality.
    location /api/ {
        proxy_pass http://ds1621.tail7aed4e.ts.net:8877;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
    location /stream {
        proxy_pass http://ds1621.tail7aed4e.ts.net:8877/stream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1d;
    }

    # SPA-style fallback: try a real file, then a directory index, then
    # a prerendered .html, finally hand off to the SPA shell.
    location /dashboard { try_files $uri $uri/ /dashboard/index.html; }
    location /          { try_files $uri $uri/ $uri.html /index.html; }

    # ACME challenge for cert renewals.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
}

# ----- analytics subdomain → umami container -----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name analytics.dht44.com;

    ssl_certificate     /etc/letsencrypt/live/analytics.dht44.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/analytics.dht44.com/privkey.pem;

    # Defer DNS lookup of the upstream to request-time using Docker's
    # embedded DNS at 127.0.0.11. With a literal `proxy_pass http://umami...`
    # nginx tries to resolve at config-load time and fails when the umami
    # container isn't up yet (or `nginx -t` runs outside the compose network).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $umami_upstream http://umami:3000;

    location / {
        proxy_pass $umami_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
}

# ----- HTTP → HTTPS -----
server {
    listen 80;
    listen [::]:80;
    server_name dht44.com www.dht44.com analytics.dht44.com;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location /                            { return 301 https://$host$request_uri; }
}
